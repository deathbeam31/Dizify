name: Gunluk film sayfasi uretimi

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sayfalari uret
        run: python3 build_pages.py
      - name: Depoya isle
        run: |
          git config user.name "filmarsivi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "Otomatik: film/dizi sayfalari guncellendi"
          git push
