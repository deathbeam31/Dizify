name: Haftalik klasik sinema

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  klasik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Klasik filmleri uret
        run: python3 build_klasik.py
      - name: Depoya isle
        run: |
          git config user.name "filmarsivi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "Otomatik: klasik sinema guncellendi"
          git push
